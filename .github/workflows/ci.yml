name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Raises the unauthenticated GitHub API rate limit for build-time
          # SSG fetches (e.g. app/sponsor/page.tsx stargazers list).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: pnpm test

      - name: Typecheck (cli, engine)
        run: pnpm typecheck

      # Non-blocking until the pre-existing React Compiler lint debt is paid
      # down (see IMPROVEMENTS.md item P17). Flip to a hard gate once web
      # lints clean.
      - name: Lint (non-blocking, tracked in P17)
        run: pnpm lint
        continue-on-error: true
